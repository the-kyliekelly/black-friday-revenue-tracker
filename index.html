<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Black Friday Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Layout concept: a single ruled ledger sheet lying on a desk, clearly separated
     from the desk behind it, red margin rule and punch holes down the left, black
     ink on the brand's blush paper with lavender as the one accent. Rule lines are
     confined to the transactions section, where they read as real ledger ruling
     instead of decoration. */
  :root {
    --desk: #e0c9cb;
    --paper: #f9f1f2;
    --paper-alt: #f0e0e2;
    --rule: rgba(6,5,4,0.16);
    --margin: #a8425a;
    --ink: #060504;
    --ink-soft: #7a6c6d;
    --stamp: #060504;
    --accent: #d4b8db;
    --paper-edge: #e6d3d5;
    --focus: #b99cc4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #0d0a0a;
      --paper: #1d1617;
      --paper-alt: #251c1d;
      --rule: rgba(247,238,240,0.14);
      --margin: #d97a8c;
      --ink: #f7eef0;
      --ink-soft: #b8a4a6;
      --stamp: #f7eef0;
      --accent: #c9a8d4;
      --paper-edge: #362a2c;
      --focus: #c9a8d4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #0d0a0a;
    --paper: #1d1617;
    --paper-alt: #251c1d;
    --rule: rgba(247,238,240,0.14);
    --margin: #d97a8c;
    --ink: #f7eef0;
    --ink-soft: #b8a4a6;
    --stamp: #f7eef0;
    --accent: #c9a8d4;
    --paper-edge: #362a2c;
    --focus: #c9a8d4;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font-family: 'Courier Prime', 'Courier New', monospace;
    padding-block: 40px;
  }
  .desk { max-width: 620px; margin: 0 auto; padding: 0 16px; }

  .sheet {
    position: relative;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    border-radius: 2px;
    box-shadow: 0 24px 44px -20px rgba(0,0,0,0.45), 0 1px 0 var(--paper-edge);
    padding: 36px 28px 30px 60px;
    overflow: hidden;
  }
  .sheet::before {
    /* red margin rule */
    content: '';
    position: absolute;
    left: 38px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--margin);
    opacity: 0.85;
  }
  .sheet::after {
    /* punch holes */
    content: '';
    position: absolute;
    left: 15px;
    top: 26px;
    bottom: 26px;
    width: 11px;
    background-image: radial-gradient(circle, var(--desk) 4.5px, transparent 5px);
    background-size: 11px 66px;
    background-repeat: repeat-y;
  }

  .corner-mark {
    position: absolute;
    top: 14px;
    right: 18px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.75;
  }

  h1 {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-weight: 400;
    font-size: clamp(24px, 5.5vw, 31px);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin: 0 0 4px;
    color: var(--ink);
    text-wrap: balance;
  }
  .underline-rule {
    border: none;
    border-top: 2px solid var(--ink);
    margin: 0 0 16px;
  }
  .stamp-line {
    display: inline-block;
    margin: 0 0 30px;
    padding: 5px 12px;
    background: color-mix(in srgb, var(--margin) 8%, transparent);
    border: 1.5px dashed var(--margin);
    color: var(--margin);
    font-style: italic;
    font-size: 13px;
    transform: rotate(-1deg);
  }

  .field-label {
    display: block;
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .summary-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 20px; }
  .summary-row > div:first-child { flex: 1; min-width: 140px; }

  input[type="number"], input[type="text"] {
    width: 100%;
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 19px;
    padding: 4px 2px 10px;
    border: none;
    border-bottom: 1.5px solid var(--ink-soft);
    background: transparent;
    color: var(--ink);
  }
  input::placeholder { color: var(--ink-soft); opacity: 0.6; }
  input:focus { outline: none; border-bottom: 1.5px solid var(--focus); }

  .stamp-btn {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 18px;
    border: 1.5px solid var(--stamp);
    border-radius: 2px;
    background: transparent;
    color: var(--stamp);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .stamp-btn:hover { background: var(--stamp); color: var(--paper); }
  .stamp-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .tally {
    display: flex;
    gap: 3px;
    margin: 0 0 10px;
  }
  .tally-seg {
    flex: 1;
    height: 13px;
    background: var(--paper-alt);
    border: 1px solid var(--ink-soft);
    opacity: 0.4;
  }
  .tally-seg.filled { background: var(--accent); border-color: var(--accent); opacity: 1; }

  .balance-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
    margin-bottom: 14px;
  }

  .total-stamp {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    padding: 10px 18px;
    border: 2px solid var(--margin);
    border-radius: 2px;
    transform: rotate(-0.5deg);
  }
  .total-stamp-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--margin);
  }
  .big-total {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-weight: 700;
    font-size: clamp(21px, 5.5vw, 25px);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .total-stamp.hit { border-color: var(--accent); }
  .total-stamp.hit .total-stamp-label,
  .total-stamp.hit .big-total { color: var(--accent); }

  .divider {
    border: none;
    border-top: 2px dashed var(--ink-soft);
    opacity: 0.5;
    margin: 34px 0 20px;
  }
  .ledger-heading {
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }

  .entry-form { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 4px; }
  .entry-form .field { flex: 2; min-width: 140px; }
  .entry-form .field.amt { flex: 1; min-width: 90px; }

  .transactions {
    margin-top: 18px;
  }

  .col-labels {
    display: flex;
    gap: 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 12px 0;
    border-top: 1.5px solid var(--ink-soft);
  }
  .col-labels .c-date { width: 60px; flex-shrink: 0; }
  .col-labels .c-desc { flex: 1; min-width: 0; }
  .col-labels .c-amt { width: 100px; text-align: right; flex-shrink: 0; }

  ul.log { list-style: none; padding: 0; margin: 0; }
  ul.log li {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 13px 0;
    border-bottom: 1px dotted var(--ink-soft);
    font-size: 14px;
  }
  ul.log li:last-child { border-bottom: none; }
  .c-date { width: 60px; flex-shrink: 0; color: var(--ink-soft); font-size: 12px; }
  .c-desc { flex: 1; min-width: 0; overflow-wrap: break-word; }
  .c-amt {
    width: 100px;
    flex-shrink: 0;
    text-align: right;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
  }
  .void-btn {
    background: none;
    border: none;
    color: var(--margin);
    cursor: pointer;
    font-family: 'Courier Prime', 'Courier New', monospace;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0;
    margin-left: 6px;
  }
  .void-btn:hover { text-decoration: line-through; }

  .empty-state {
    text-align: center;
    color: var(--ink-soft);
    font-style: italic;
    padding: 16px 0 4px;
    font-size: 14px;
  }

  .footer {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .footer .stamp-btn { background: var(--stamp); color: var(--paper); }
  .footer .stamp-btn:hover { background: transparent; color: var(--stamp); }
  .footer-links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .footer-links a {
    color: var(--ink-soft);
    text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .footer-links a:hover { color: var(--ink); border-bottom-color: var(--accent); }
  .footer-dot { opacity: 0.6; }

  @media (max-width: 420px) {
    .sheet { padding: 30px 18px 24px 46px; }
    .sheet::before { left: 26px; }
    .sheet::after { left: 10px; width: 8px; }
    .corner-mark { display: none; }
  }
</style>
</head>
<body>

<div class="desk">
  <div class="sheet">
    <span class="corner-mark">Form BF-49</span>
    <h1>Black Friday Ledger</h1>
    <hr class="underline-rule">
    <span class="stamp-line">No spreadsheet building. No guessing. Just plug in and go.</span>

    <div class="summary-row">
      <div>
        <label class="field-label" for="goalInput">Target for the day</label>
        <input type="number" id="goalInput" placeholder="e.g. 1000" min="0" inputmode="decimal">
      </div>
      <button class="stamp-btn" id="saveGoalBtn">Set Target</button>
    </div>

    <div class="tally" id="tally" aria-hidden="true"></div>
    <div class="balance-row">
      <span id="progressLabel">$0 of $0</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="total-stamp" id="totalStamp">
      <span class="total-stamp-label">Balance</span>
      <span class="big-total" id="remainingLabel">Set your target</span>
    </div>

    <hr class="divider">
    <p class="ledger-heading">Transactions</p>

    <div class="entry-form">
      <div class="field">
        <label class="field-label" for="saleNote">Description</label>
        <input type="text" id="saleNote" placeholder="What sold?">
      </div>
      <div class="field amt">
        <label class="field-label" for="saleAmount">Amount</label>
        <input type="number" id="saleAmount" placeholder="$" min="0" inputmode="decimal">
      </div>
      <button class="stamp-btn" id="addSaleBtn">Post Entry</button>
    </div>

    <div class="transactions">
      <div class="col-labels">
        <span class="c-date">Date</span>
        <span class="c-desc">Description</span>
        <span class="c-amt">Amount</span>
      </div>
      <ul class="log" id="salesLog"></ul>
    </div>
    <p class="empty-state" id="emptyState">No entries yet. Post your first sale above.</p>
  </div>

  <div class="footer">
    <a class="stamp-btn" href="http://shop.kyliekelly.com/" target="_blank" rel="noopener">Browse The Shop</a>
    <div class="footer-links">
      <a href="https://kyliekelly.com/" target="_blank" rel="noopener">kyliekelly.com</a>
      <span class="footer-dot">&middot;</span>
      <a href="https://kyliekelly.com/privacy-policy" target="_blank" rel="noopener">Privacy Policy</a>
    </div>
  </div>
</div>

<script>
(function() {
  const STORAGE_KEY = 'bfms_revenue_tracker_v1';

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { goal: 0, sales: [] };
      const parsed = JSON.parse(raw);
      return {
        goal: typeof parsed.goal === 'number' ? parsed.goal : 0,
        sales: Array.isArray(parsed.sales) ? parsed.sales : []
      };
    } catch (e) {
      return { goal: 0, sales: [] };
    }
  }

  function saveState(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      // storage unavailable, fail silently, state still works for this session
    }
  }

  function todayStamp() {
    const d = new Date();
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  let state = loadState();

  const goalInput = document.getElementById('goalInput');
  const saveGoalBtn = document.getElementById('saveGoalBtn');
  const tally = document.getElementById('tally');
  const progressLabel = document.getElementById('progressLabel');
  const progressPercent = document.getElementById('progressPercent');
  const remainingLabel = document.getElementById('remainingLabel');
  const totalStamp = document.getElementById('totalStamp');
  const saleNote = document.getElementById('saleNote');
  const saleAmount = document.getElementById('saleAmount');
  const addSaleBtn = document.getElementById('addSaleBtn');
  const salesLog = document.getElementById('salesLog');
  const emptyState = document.getElementById('emptyState');

  // build the 10-segment tally bar once
  const segs = [];
  for (let i = 0; i < 10; i++) {
    const s = document.createElement('div');
    s.className = 'tally-seg';
    tally.appendChild(s);
    segs.push(s);
  }

  function formatMoney(n) {
    return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  function totalSales() {
    return state.sales.reduce((sum, s) => sum + s.amount, 0);
  }

  function render() {
    goalInput.value = state.goal || '';
    const total = totalSales();
    const goal = state.goal || 0;
    const pct = goal > 0 ? Math.min(100, Math.round((total / goal) * 100)) : 0;

    const filledSegs = Math.round(pct / 10);
    segs.forEach((s, i) => s.classList.toggle('filled', i < filledSegs));

    progressLabel.textContent = formatMoney(total) + ' of ' + formatMoney(goal);
    progressPercent.textContent = pct + '%';

    totalStamp.classList.remove('hit');
    if (goal > 0) {
      const remaining = Math.max(0, goal - total);
      if (remaining > 0) {
        remainingLabel.textContent = formatMoney(remaining) + ' to go';
      } else {
        remainingLabel.textContent = 'TARGET REACHED';
        totalStamp.classList.add('hit');
      }
    } else {
      remainingLabel.textContent = 'Set your target';
    }

    salesLog.innerHTML = '';
    if (state.sales.length === 0) {
      emptyState.style.display = 'block';
    } else {
      emptyState.style.display = 'none';
      state.sales.slice().reverse().forEach((sale, idxFromEnd) => {
        const realIdx = state.sales.length - 1 - idxFromEnd;
        const li = document.createElement('li');

        const dateSpan = document.createElement('span');
        dateSpan.className = 'c-date';
        dateSpan.textContent = sale.date || '—';

        const descSpan = document.createElement('span');
        descSpan.className = 'c-desc';
        descSpan.textContent = sale.note ? sale.note : 'Sale';

        const amtSpan = document.createElement('span');
        amtSpan.className = 'c-amt';
        amtSpan.textContent = formatMoney(sale.amount);

        const voidBtn = document.createElement('button');
        voidBtn.className = 'void-btn';
        voidBtn.type = 'button';
        voidBtn.textContent = 'void';
        voidBtn.addEventListener('click', function() {
          state.sales.splice(realIdx, 1);
          saveState(state);
          render();
        });
        amtSpan.appendChild(voidBtn);

        li.appendChild(dateSpan);
        li.appendChild(descSpan);
        li.appendChild(amtSpan);
        salesLog.appendChild(li);
      });
    }
  }

  saveGoalBtn.addEventListener('click', function() {
    const val = parseFloat(goalInput.value);
    state.goal = isNaN(val) || val < 0 ? 0 : val;
    saveState(state);
    render();
  });

  addSaleBtn.addEventListener('click', function() {
    const amt = parseFloat(saleAmount.value);
    if (isNaN(amt) || amt <= 0) return;
    state.sales.push({ note: saleNote.value.trim(), amount: amt, date: todayStamp() });
    saveState(state);
    saleNote.value = '';
    saleAmount.value = '';
    render();
  });

  render();
})();
</script>
</body>

</html>
